<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Consulta - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>

      <nav class="patient-nav">
        <a href="paciente_dashboard.html">Início</a>
        <a href="buscar_especialista.html" class="active">Agendar consulta</a>
        <a href="#">Histórico de laudos</a>
      </nav>

      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá, [Nome]</span>
        <button id="btn-logout" class="btn-outline" style="padding: 8px 16px; width: auto;">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    
    <a href="perfil_medico.html" class="back-link-page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar para o perfil
    </a>

    <h1 class="welcome-title" style="margin-bottom: 24px;">Agendar consulta</h1>

    <!-- Stepper visual indicando que estamos na Etapa 1 -->
    <div class="stepper">
      <div class="step active">
        <div class="step-circle">1</div>
        <span>Dia e horário</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <div class="step-circle">2</div>
        <span>Dados da consulta</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <div class="step-circle">3</div>
        <span>Revisão</span>
      </div>
    </div>

    <div class="booking-layout">
      
      <!-- Coluna principal de escolha -->
      <div>
        <h2 class="section-title">Escolha o dia e o horário</h2>
        
        <!-- Opções: Consulta no local ou Teleconsulta -->
        <div class="tipo-consulta-grid">
          <label class="radio-card selected" id="card-presencial">
            <input type="radio" name="tipo-consulta" value="Presencial" checked>
            <span class="radio-card-titulo">Consulta no local</span>
          </label>
          <label class="radio-card" id="card-teleconsulta">
            <input type="radio" name="tipo-consulta" value="Teleconsulta">
            <span class="radio-card-titulo">Teleconsulta</span>
          </label>
        </div>

        <!-- Grid de dias da semana -->
        <div class="dias-grid" id="dias-grid">
          <!-- Os dias serão renderizados pelo JavaScript -->
        </div>

        <!-- Grid de horários -->
        <div class="horarios-grid-container" id="horarios-container">
          <!-- Os horários serão renderizados pelo JavaScript -->
        </div>

      </div>

      <!-- Resumo lateral (sticky) -->
      <div class="booking-summary">
        <h3>Resumo</h3>
        
        <div class="summary-medico-info">
          <div class="summary-avatar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div>
            <p class="summary-nome" id="resumo-nome">Carregando...</p>
            <p class="summary-especialidade" id="resumo-especialidade"></p>
          </div>
        </div>

        <div class="summary-item">
          <label>Serviço</label>
          <span>Consulta</span>
        </div>
        <div class="summary-item">
          <label>Valor</label>
          <span id="resumo-valor">R$ 0,00</span>
        </div>
        <div class="summary-item">
          <label>Horário escolhido</label>
          <span id="resumo-horario">Nenhum</span>
        </div>
      </div>

    </div>

    <!-- Botões de navegação -->
    <div class="action-buttons" style="margin-top: 32px;">
      <a href="perfil_medico.html" class="btn btn-outline" style="width: auto;">Voltar</a>
      <button id="btn-avancar" class="btn btn-primary" style="width: auto;" disabled>Avançar</button>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
