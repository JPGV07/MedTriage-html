<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Consulta - Etapa 2 - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>

      <nav class="patient-nav">
        <a href="paciente_dashboard.html">Início</a>
        <a href="buscar_especialista.html" class="active">Agendar consulta</a>
        <a href="#">Histórico de laudos</a>
      </nav>

      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá, [Nome]</span>
        <button id="btn-logout" class="btn-outline" style="padding: 8px 16px; width: auto;">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    
    <a href="agendar_etapa1.html" class="back-link-page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar para a etapa anterior
    </a>

    <h1 class="welcome-title" style="margin-bottom: 24px;">Agendar consulta</h1>

    <!-- Stepper: Etapa 1 concluída, Etapa 2 ativa -->
    <div class="stepper">
      <div class="step completed">
        <div class="step-circle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span>Dia e horário</span>
      </div>
      <div class="step-line"></div>
      <div class="step active">
        <div class="step-circle">2</div>
        <span>Dados da consulta</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <div class="step-circle">3</div>
        <span>Revisão</span>
      </div>
    </div>

    <div class="booking-layout">
      
      <!-- Formulário de dados da consulta -->
      <div>
        <h2 class="section-title">Dados da consulta</h2>
        
        <form id="form-etapa2">
          
          <!-- A consulta é para quem? -->
          <label class="label-pergunta">A consulta é para quem?</label>
          <div class="tipo-consulta-grid">
            <label class="radio-card selected" id="card-para-mim">
              <input type="radio" name="para-quem" value="Para mim" checked>
              <span class="radio-card-titulo">Para mim</span>
            </label>
            <label class="radio-card" id="card-para-outra">
              <input type="radio" name="para-quem" value="Para outra pessoa">
              <span class="radio-card-titulo">Para outra pessoa</span>
            </label>
          </div>

          <!-- Convênio -->
          <div class="input-group">
            <label for="etapa2-convenio">Convênio</label>
            <select id="etapa2-convenio" class="input-select">
              <option value="Sem plano de saúde">Estou agendando sem plano de saúde</option>
              <option value="Unimed">Unimed</option>
              <option value="Bradesco Saúde">Bradesco Saúde</option>
              <option value="SulAmérica">SulAmérica</option>
              <option value="Amil">Amil</option>
            </select>
          </div>

          <!-- Primeiro atendimento? -->
          <label class="label-pergunta" style="margin-top: 24px;">É o seu primeiro atendimento com este especialista?</label>
          <div class="tipo-consulta-grid">
            <label class="radio-card selected" id="card-primeira-sim">
              <input type="radio" name="primeira-vez" value="Sim" checked>
              <span class="radio-card-titulo">Sim</span>
            </label>
            <label class="radio-card" id="card-primeira-nao">
              <input type="radio" name="primeira-vez" value="Não">
              <span class="radio-card-titulo">Não</span>
            </label>
          </div>

          <!-- Motivo da consulta -->
          <div class="input-group" style="margin-top: 24px;">
            <label for="etapa2-motivo">Motivo da consulta (opcional)</label>
            <input type="text" id="etapa2-motivo" placeholder="Escreva em poucas palavras">
          </div>

        </form>
      </div>

      <!-- Resumo lateral -->
      <div class="booking-summary">
        <h3>Resumo</h3>
        
        <div class="summary-medico-info">
          <div class="summary-avatar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div>
            <p class="summary-nome" id="resumo-nome">Carregando...</p>
            <p class="summary-especialidade" id="resumo-especialidade"></p>
          </div>
        </div>

        <div class="summary-item">
          <label>Tipo</label>
          <span id="resumo-tipo">-</span>
        </div>
        <div class="summary-item">
          <label>Data e Horário</label>
          <span id="resumo-horario">-</span>
        </div>
        <div class="summary-item">
          <label>Valor</label>
          <span id="resumo-valor">R$ 0,00</span>
        </div>
      </div>

    </div>

    <!-- Botões -->
    <div class="action-buttons" style="margin-top: 32px;">
      <a href="agendar_etapa1.html" class="btn btn-outline" style="width: auto;">Voltar</a>
      <button id="btn-avancar-etapa2" class="btn btn-primary" style="width: auto;">Avançar</button>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
