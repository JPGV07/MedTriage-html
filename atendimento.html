<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>
      <nav class="patient-nav">
        <a href="medico_dashboard.html">Meus pacientes</a>
        <a href="#">Ver consultas</a>
        <a href="#">Histórico de atendimentos</a>
        <a href="medico_perfil.html">Meu Perfil</a>
      </nav>
      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá, Dr(a). [Nome]</span>
        <button id="btn-logout" class="btn-outline" style="padding: 8px 16px; width: auto;">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    
    <a href="medico_dashboard.html" class="back-link-page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar para a agenda
    </a>

    <h1 class="welcome-title" style="margin-bottom: 8px;">Atendimento</h1>
    <p id="atendimento-paciente-info" style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;">-</p>

    <div class="atendimento-container">
      
      <!-- Card com dados da consulta -->
      <div class="atendimento-info-card">
        <div class="atendimento-info-grid">
          <div>
            <label>Paciente</label>
            <p id="atendimento-paciente-nome">-</p>
          </div>
          <div>
            <label>CPF</label>
            <p id="atendimento-paciente-cpf">-</p>
          </div>
          <div>
            <label>Data e horário</label>
            <p id="atendimento-data">-</p>
          </div>
          <div>
            <label>Tipo</label>
            <p id="atendimento-tipo">-</p>
          </div>
          <div>
            <label>Motivo da consulta</label>
            <p id="atendimento-motivo">-</p>
          </div>
        </div>
      </div>

      <!-- Card com o laudo -->
      <div class="atendimento-laudo-card">
        <h2 class="section-title">Laudo</h2>
        <p class="helper-text" style="margin-bottom: 16px;">Escreva o laudo em frases curtas e simples.</p>

        <textarea 
          id="texto-laudo" 
          class="textarea-laudo" 
          placeholder="Digite aqui o laudo do atendimento..."
        ></textarea>

        <div class="atendimento-acoes">
          <button id="btn-finalizar" class="btn btn-primary" style="width: auto;">Finalizar atendimento</button>
          <button id="btn-rascunho" class="btn btn-outline" style="width: auto;">Salvar rascunho</button>
          <a href="medico_dashboard.html" class="btn btn-outline" style="width: auto; border: none; color: var(--text-muted);">Cancelar</a>
        </div>
      </div>

    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
