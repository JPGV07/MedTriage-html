<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reagendar Consulta - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>
      <nav class="patient-nav">
        <a href="paciente_dashboard.html">Início</a>
        <a href="buscar_especialista.html" class="active">Agendar consulta</a>
        <a href="#">Histórico de laudos</a>
      </nav>
      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá, [Nome]</span>
        <button id="btn-logout" class="btn-outline" style="padding: 8px 16px; width: auto;">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    
    <a href="detalhes_consulta.html" class="back-link-page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar para os detalhes
    </a>

    <h1 class="welcome-title" style="margin-bottom: 24px;">Reagendar consulta</h1>

    <div class="booking-layout">
      
      <!-- Coluna principal: calendário e horários -->
      <div>
        <h2 class="section-title">Escolha a nova data e horário</h2>
        
        <div class="dias-grid" id="dias-grid"></div>
        
        <div class="horarios-grid-container" id="horarios-container">
          <p style="color: var(--text-muted); padding: 20px 0;">Selecione um dia para ver os horários disponíveis.</p>
        </div>
      </div>

      <!-- Coluna lateral: resumo -->
      <div class="booking-summary">
        <h3>Resumo</h3>
        
        <div class="summary-medico-info">
          <div class="summary-avatar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div>
            <p class="summary-nome" id="resumo-nome">-</p>
            <p class="summary-especialidade" id="resumo-especialidade"></p>
          </div>
        </div>
        
        <div class="summary-item">
          <label>Consulta atual</label>
          <span id="resumo-atual">-</span>
        </div>
        
        <div class="summary-item">
          <label>Nova data</label>
          <span id="resumo-nova-data">Nenhuma</span>
        </div>
        
        <div class="summary-item">
          <label>Valor</label>
          <span id="resumo-valor">-</span>
        </div>
      </div>
      
    </div>

    <!-- Botões de ação (fora do grid para ocupar a largura toda) -->
    <div class="action-buttons" style="margin-top: 32px;">
      <a href="detalhes_consulta.html" class="btn btn-outline" style="width: auto;">Cancelar</a>
      <button id="btn-confirmar-reagendamento" class="btn btn-primary" style="width: auto;" disabled>Confirmar reagendamento</button>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
