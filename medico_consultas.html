<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerenciamento das consultas médicas agendadas no MedTriage.">
    <title>Minhas Consultas | MedTriage</title>
    <link rel="stylesheet" href="css/style.css">
    </style>
</head>

<body>

    <!-- Cabeçalho e navegação -->
    <header class="patient-header">
        <div class="patient-header-container">

            <div class="brand" style="margin-bottom: 0;">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
                    <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span>MedTriage</span>
            </div>

            <nav class="patient-nav" aria-label="Navegação principal">
                <a href="medico_dashboard.html">Meus pacientes</a>
                <a href="medico_consultas.html" class="active" aria-current="page">Ver consultas</a>
                <a href="medico_historico_atendimentos.html">Histórico de atendimentos</a>
                <a href="medico_perfil.html">Meu Perfil</a>
            </nav>

            <div class="patient-user-area">
                <span class="user-greeting" id="user-greeting">Olá, Dr(a). [Nome]</span>
                <button type="button" id="btn-logout" class="btn-outline" style="padding: 8px 16px; width: auto;">
                    Sair
                </button>
            </div>

        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="dashboard-main">

        <section class="welcome-section">
            <h1>Minhas consultas</h1>
            <p>Todas as consultas agendadas com você.</p>
        </section>

        <!-- Filtros por situação -->
        <section class="filtros-consulta" role="group" aria-label="Filtrar consultas por situação">

            <button type="button" class="filtro-btn active" data-filtro="todas" aria-pressed="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <line x1="8" y1="6"  x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6"  x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                Todas
                <span class="filtro-count" data-count="todas">–</span>
            </button>

            <button type="button" class="filtro-btn" data-filtro="Aguardando" aria-pressed="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <polyline points="12 7 12 12 15 14"/>
                </svg>
                Aguardando
                <span class="filtro-count" data-count="Aguardando">–</span>
            </button>

            <button type="button" class="filtro-btn" data-filtro="Realizada" aria-pressed="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <polyline points="8 12 11 15 16 9"/>
                </svg>
                Realizadas
                <span class="filtro-count" data-count="Realizada">–</span>
            </button>

            <button type="button" class="filtro-btn" data-filtro="Cancelada" aria-pressed="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <line x1="9" y1="9"  x2="15" y2="15"/>
                    <line x1="9" y1="15" x2="15" y2="9"/>
                </svg>
                Canceladas
                <span class="filtro-count" data-count="Cancelada">–</span>
            </button>

        </section>

        <!-- Consultas cadastradas -->
        <section aria-label="Lista de consultas">
            <div id="lista-consultas-medico" aria-live="polite"></div>

            <div class="laudos-vazio" id="consultas-vazio" style="display: none;"
                 role="status" aria-live="polite">

                <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
                     stroke="var(--border-color)" stroke-width="1.5"
                     style="margin-bottom: 16px;" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2"  x2="8"  y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>

                <h3 id="consultas-vazio-titulo">Nenhuma consulta encontrada</h3>
                <p id="consultas-vazio-texto">Você ainda não tem consultas com esse status.</p>

                <button type="button" class="btn btn-outline btn-limpar-filtro"
                        id="btn-limpar-filtro" style="display: none;">
                    Ver todas as consultas
                </button>
            </div>
        </section>

    </main>

    <script src="js/main.js"></script>

    <!-- Contadores, mensagens contextuais e limpar filtro -->
    <script>
        (function () {
            const container    = document.getElementById('lista-consultas-medico');
            const emptyState   = document.getElementById('consultas-vazio');
            const emptyTitulo  = document.getElementById('consultas-vazio-titulo');
            const emptyTexto   = document.getElementById('consultas-vazio-texto');
            const btnLimpar    = document.getElementById('btn-limpar-filtro');
            const filterBtns   = document.querySelectorAll('.filtro-btn');
            const countSpans   = document.querySelectorAll('.filtro-count');

            if (!container) return;

            // ---------- Helpers ----------

            const getActiveFilter = () =>
                document.querySelector('.filtro-btn.active')?.dataset.filtro || 'todas';

            // Detecta situação da consulta lendo o texto do card
            const detectStatus = (card) => {
                const t = card.textContent.toLowerCase();
                if (t.includes('aguardando')) return 'Aguardando';
                if (t.includes('realizada'))  return 'Realizada';
                if (t.includes('cancelada'))  return 'Cancelada';
                return null;
            };

            // ---------- Contadores ----------
            // Só recalcula quando o filtro "todas" está ativo,
            // para refletir o conjunto completo de consultas.

            function updateCounts() {
                if (getActiveFilter() !== 'todas') return;

                // Tenta os seletores conhecidos; cai para filhos diretos do container
                let items = container.querySelectorAll('.consulta-item-card');
                if (!items.length) {
                    items = [...container.children].filter(el => el.nodeType === 1);
                }

                const counts = { todas: 0, Aguardando: 0, Realizada: 0, Cancelada: 0 };

                items.forEach(card => {
                    counts.todas++;
                    const st = detectStatus(card);
                    if (st) counts[st]++;
                });

                countSpans.forEach(span => {
                    const key = span.dataset.count;
                    if (key in counts) span.textContent = counts[key];
                });
            }

            // ---------- Mensagem contextual ----------
            const messages = {
                todas:      ['Nenhuma consulta encontrada', 'Você ainda não tem consultas cadastradas.'],
                Aguardando: ['Nenhuma consulta aguardando', 'Não há consultas com esse status no momento.'],
                Realizada:  ['Nenhuma consulta realizada', 'Você ainda não concluiu nenhum atendimento.'],
                Cancelada:  ['Nenhuma consulta cancelada', 'Não há cancelamentos registrados.']
            };

            function updateEmptyMessage() {
                const f = getActiveFilter();
                const [titulo, texto] = messages[f] || messages.todas;
                if (emptyTitulo) emptyTitulo.textContent = titulo;
                if (emptyTexto)  emptyTexto.textContent  = texto;

                // Mostra o botão "Ver todas" só se o filtro atual não for "todas"
                if (btnLimpar) {
                    const vazioVisivel = emptyState &&
                        getComputedStyle(emptyState).display !== 'none';
                    btnLimpar.style.display = (vazioVisivel && f !== 'todas') ? 'inline-flex' : 'none';
                }
            }

            // ---------- Limpar filtro ----------
            btnLimpar?.addEventListener('click', () => {
                document.querySelector('.filtro-btn[data-filtro="todas"]')?.click();
            });

            // ---------- Hooks ----------
            // main.js roda seus próprios listeners primeiro (foi incluído antes).
            // Usamos setTimeout(0) para rodar DEPOIS dele no mesmo tick.
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    setTimeout(() => {
                        updateCounts();
                        updateEmptyMessage();
                    }, 0);
                });
            });

            // Reage quando main.js re-renderiza a lista
            new MutationObserver(() => {
                updateCounts();
                updateEmptyMessage();
            }).observe(container, { childList: true, subtree: true });

            // Estado inicial (default = "todas")
            setTimeout(() => {
                updateCounts();
                updateEmptyMessage();
            }, 100);
        })();
    </script>

</body>

</html>
