<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Acesso - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Logo -->
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="#005A8D"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>

      <!-- Link de voltar -->
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Voltar para a entrada
      </a>

      <h1 class="title">Crie seu acesso</h1>
      <p class="subtitle">Você só precisa do seu CPF e de uma senha.</p>

      <!-- Formulário de Cadastro -->
      <form id="cadastro-form">
        
        <!-- Campo CPF -->
        <div class="input-group">
          <label for="cpf-cadastro">CPF</label>
          <div class="input-wrapper">
            <input type="text" id="cpf-cadastro" placeholder="000.000.000-00" required>
          </div>
        </div>

        <!-- Campo Criar Senha -->
        <div class="input-group">
          <label for="nova-senha">Criar senha</label>
          <div class="input-wrapper">
            <input type="password" id="nova-senha" placeholder="Escolha uma senha" required>
            <button type="button" class="icon-btn toggle-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <!-- Texto de ajuda -->
          <span class="helper-text">Use pelo menos 6 caracteres, com letras e números.</span>
        </div>

        <!-- Campo Repetir Senha -->
        <div class="input-group">
          <label for="repetir-senha">Repetir a senha</label>
          <div class="input-wrapper">
            <input type="password" id="repetir-senha" placeholder="Digite a senha de novo" required>
            <button type="button" class="icon-btn toggle-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <!-- Campo E-mail -->
        <div class="input-group">
          <label for="email-cadastro">E-mail (opcional)</label>
          <div class="input-wrapper">
            <input type="email" id="email-cadastro" placeholder="nome@exemplo.com">
          </div>
          <span class="helper-text">Serve para avisar das consultas. Pode deixar em branco.</span>
        </div>

        <!-- Checkbox de Termos -->
        <div class="checkbox-group">
          <input type="checkbox" id="termos" required>
          <label for="termos">Li e aceito os termos de uso</label>
        </div>

        <button type="submit" class="btn btn-primary">Criar meu acesso</button>
      </form>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
