<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico do Paciente - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>
      <nav class="patient-nav">
        <a href="medico_dashboard.html">Meus pacientes</a>
        <a href="#">Ver consultas</a>
        <a href="#">Histórico de atendimentos</a>
        <a href="medico_perfil.html">Meu Perfil</a>
      </nav>
      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá, Dr(a). [Nome]</span>
        <button id="btn-logout" class="btn-outline" style="padding: 8px 16px; width: auto;">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    
    <a href="medico_dashboard.html" class="back-link-page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar para meus pacientes
    </a>

    <div class="welcome-section">
      <h1 id="historico-paciente-nome">Histórico do Paciente</h1>
      <p id="historico-paciente-cpf">CPF: -</p>
    </div>

    <h2 class="section-title">Atendimentos anteriores</h2>

    <div id="lista-historico-medico"></div>

    <div class="laudos-vazio" id="historico-vazio" style="display: none;">
      <h3>Nenhum atendimento registrado</h3>
      <p>Este paciente ainda não realizou consultas com você.</p>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
