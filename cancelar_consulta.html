<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar Consulta - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="patient-header">
    <div class="patient-header-container">
      <div class="brand" style="margin-bottom: 0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>
      <nav class="patient-nav">
        <a href="paciente_dashboard.html">Início</a>
        <a href="buscar_especialista.html" class="active">Agendar consulta</a>
        <a href="#">Histórico de laudos</a>
      </nav>
      <div class="patient-user-area">
        <span class="user-greeting" id="user-greeting">Olá, [Nome]</span>
        <button id="btn-logout" class="btn-outline" style="padding: 8px 16px; width: auto;">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    
    <a href="detalhes_consulta.html" class="back-link-page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar para os detalhes
    </a>

    <div class="cancelamento-container">
      <div class="cancelamento-card">
        <div class="cancelamento-icone">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="11" stroke="#EF4444" stroke-width="2"/>
            <path d="M8 8L16 16M16 8L8 16" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="cancelamento-titulo">Cancelar consulta</h1>
        <p class="cancelamento-subtitulo">Tem certeza que deseja cancelar esta consulta? Esta ação não pode ser desfeita.</p>

        <div class="cancelamento-dados">
          <div class="cancelamento-item"><label>Data e horário</label><p id="cancel-data">-</p></div>
          <div class="cancelamento-item"><label>Médico</label><p id="cancel-medico">-</p></div>
          <div class="cancelamento-item"><label>Serviço</label><p id="cancel-servico">-</p></div>
          <div class="cancelamento-item"><label>Local</label><p id="cancel-local">-</p></div>
        </div>

        <div class="cancelamento-acoes">
          <a href="detalhes_consulta.html" class="btn btn-outline" style="width: auto;">Voltar</a>
          <button id="btn-confirmar-cancelamento" class="btn btn-perigo" style="width: auto;">Sim, cancelar consulta</button>
        </div>
      </div>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
