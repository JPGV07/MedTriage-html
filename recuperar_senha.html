<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - MedTriage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Logo -->
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/>
          <path d="M12 6V18M6 12H18" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>MedTriage</span>
      </div>

      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Voltar para o login
      </a>

      <!-- O título e o label do ID serão alterados via JS dependendo do perfil -->
      <h1 class="title">Redefinir senha</h1>
      <p class="subtitle" id="subtitulo-recuperacao">Informe seus dados para criar uma nova senha.</p>

      <form id="recuperar-form">
        
        <!-- Campo de Identificação (CPF ou Matrícula) -->
        <div class="input-group">
          <label for="input-recuperar-id" id="label-recuperar-id">CPF</label>
          <div class="input-wrapper">
            <input type="text" id="input-recuperar-id" placeholder="000.000.000-00" required>
          </div>
        </div>

        <!-- Campo Nova Senha -->
        <div class="input-group">
          <label for="nova-senha-recuperar">Nova senha</label>
          <div class="input-wrapper">
            <input type="password" id="nova-senha-recuperar" placeholder="Digite a nova senha" required>
            <button type="button" class="icon-btn toggle-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <span class="helper-text">Use pelo menos 6 caracteres.</span>
        </div>

        <!-- Campo Confirmar Nova Senha -->
        <div class="input-group">
          <label for="repetir-senha-recuperar">Confirmar nova senha</label>
          <div class="input-wrapper">
            <input type="password" id="repetir-senha-recuperar" placeholder="Repita a nova senha" required>
            <button type="button" class="icon-btn toggle-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Salvar nova senha</button>
      </form>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
